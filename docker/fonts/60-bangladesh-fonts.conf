<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Installed by install-fonts.sh. Makes the Wine clones visible, and sends Microsoft font names
     that have a metric-compatible (or, for Bangla, a closest free) stand-in to it. -->
<fontconfig>
  <dir>/usr/share/wine/fonts</dir>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Selawik</family></prefer></alias>
  <alias binding="same"><family>Verdana</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Tahoma</family><prefer><family>Tahoma</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Comic Sans MS</family><prefer><family>Comic Neue</family></prefer></alias>
  <alias binding="same"><family>Vrinda</family><prefer><family>SolaimanLipi</family><family>Noto Sans Bengali</family></prefer></alias>
  <alias binding="same"><family>Nirmala UI</family><prefer><family>Noto Sans Bengali</family></prefer></alias>
  <alias binding="same"><family>Shonar Bangla</family><prefer><family>Noto Serif Bengali</family></prefer></alias>
  <alias binding="same"><family>SutonnyOMJ</family><prefer><family>SolaimanLipi</family></prefer></alias>
  <alias binding="same"><family>SolaimanLipiNormal</family><prefer><family>SolaimanLipi</family></prefer></alias>
</fontconfig>
