# Scalable Architecture Stack (MicroVM)
# 
# This demonstrates the split API + Worker architecture for horizontal scaling.
# The sandbox runs inside a libkrun microVM with its own guest kernel.
# In production, use Kubernetes with HPA for auto-scaling.
#
# Requires: /dev/kvm accessible in Docker (WSL2 with nested virt, or bare metal Linux)
#
# Usage: docker compose -f docker-compose.scalable.yml up --scale worker-sandbox=3 --scale api=2
#
# Architecture:
# ┌─────────────────────────────────────────────────────────────────────────┐
# │                        Shared Infrastructure                            │
# │  ┌───────────┐  ┌───────────┐  ┌─────────────┐  ┌──────────────────┐   │
# │  │   Redis   │  │   MinIO   │  │ file_server │  │ tool_call_server │   │
# │  │  (queue)  │  │  (files)  │  │ (stateless) │  │   (stateless)    │   │
# │  └───────────┘  └───────────┘  └─────────────┘  └──────────────────┘   │
# └─────────────────────────────────────────────────────────────────────────┘
#                                    │
#          ┌─────────────────────────┴─────────────────────────┐
#          │                                                   │
#          ▼                                                   ▼
# ┌─────────────────────┐                     ┌─────────────────────────────┐
# │    API Service      │                     │    Worker-Sandbox Pods      │
# │    (HTTP only)      │                     │                             │
# │  ┌───────────────┐  │                     │ ┌─────────────────────────┐ │
# │  │  api (N pods) │  │ ──submits jobs──▶   │ │   worker + sandbox (M)  │ │
# │  └───────────────┘  │                     │ │   worker + sandbox (M)  │ │
# │                     │ ◀──receives results─│ │   worker + sandbox (M)  │ │
# └─────────────────────┘                     │ └─────────────────────────┘ │
#                                             └─────────────────────────────┘
#
# Scaling:
# - api: Scale based on HTTP traffic (requests/sec, latency)
# - worker-sandbox: Scale based on queue depth (jobs waiting)
# - file_server: Scale based on upload/download throughput
# - tool_call_server: Scale based on tool call volume
#
services:
  # =============================================================================
  # SHARED INFRASTRUCTURE (Scale independently)
  # =============================================================================

  # Redis - Shared job queue and state store
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-localdev}
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "localdev", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # MinIO (S3-compatible storage) - Shared file storage
  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 3

  # File Server - Stateless, scales independently
  file_server:
    build:
      context: .
      dockerfile: service/Dockerfile
      target: production
    ports:
      - 3000:3000
    environment:
      - MINIO_BUCKET=test-bucket
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - FILE_SERVER_PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-localdev}
      - CODEAPI_INTERNAL_SERVICE_TOKEN=${CODEAPI_INTERNAL_SERVICE_TOKEN:-localdev-internal-service-token}
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      replicas: 1  # Can scale independently

  # Tool Call Server - Stateless, scales independently
  tool_call_server:
    build:
      context: .
      dockerfile: service/Dockerfile.tool-call-server
      target: production
    ports:
      - 3033:3033
    environment:
      - TOOL_CALL_SERVER_PORT=3033
      - TOOL_CALL_REQUEST_TIMEOUT=300000
      - TOOL_CALL_SESSION_EXPIRY=600
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-localdev}
      - CODEAPI_INTERNAL_SERVICE_TOKEN=${CODEAPI_INTERNAL_SERVICE_TOKEN:-localdev-internal-service-token}
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 1  # Can scale independently

  # =============================================================================
  # API SERVICE (HTTP handlers only, no workers)
  # Scale based on: HTTP traffic, request latency
  # =============================================================================
  api:
    build:
      context: .
      dockerfile: service/Dockerfile.api
      target: production
    ports:
      - "3112-3119:3112"  # Port range for multiple instances
    environment:
      - LOCAL_MODE=${LOCAL_MODE:-true}
      - CODEAPI_HARDENED_SANDBOX_MODE=${CODEAPI_HARDENED_SANDBOX_MODE:-true}
      # JWT verification config — this block was missing entirely from this
      # file (present in base docker-compose.yaml but never ported over),
      # which is why the api container failed to start with "No CodeAPI
      # JWT verification keys configured" even with a correct .env.
      - CODEAPI_AUTH_PROVIDER=${CODEAPI_AUTH_PROVIDER:-}
      - CODEAPI_ALLOW_AUTH_PROVIDER_NONE=${CODEAPI_ALLOW_AUTH_PROVIDER_NONE:-}
      - CODEAPI_JWT_ISSUER=${CODEAPI_JWT_ISSUER:-}
      - CODEAPI_JWT_AUDIENCE=${CODEAPI_JWT_AUDIENCE:-}
      - CODEAPI_JWT_ALLOWED_ALGS=${CODEAPI_JWT_ALLOWED_ALGS:-}
      - CODEAPI_JWT_CLOCK_SKEW_SECONDS=${CODEAPI_JWT_CLOCK_SKEW_SECONDS:-}
      - CODEAPI_JWT_MAX_TTL_SECONDS=${CODEAPI_JWT_MAX_TTL_SECONDS:-}
      - CODEAPI_JWT_KEY_CACHE_TTL_SECONDS=${CODEAPI_JWT_KEY_CACHE_TTL_SECONDS:-}
      - CODEAPI_JWT_JWKS_JSON=${CODEAPI_JWT_JWKS_JSON:-}
      - CODEAPI_JWT_PUBLIC_KEYS_DIR=${CODEAPI_JWT_PUBLIC_KEYS_DIR:-}
      - CODEAPI_JWT_PUBLIC_KEY=${CODEAPI_JWT_PUBLIC_KEY:-}
      - CODEAPI_JWT_KID=${CODEAPI_JWT_KID:-}
      - CODEAPI_JWT_KEY_ID=${CODEAPI_JWT_KEY_ID:-}
      - CODEAPI_JWT_HS256_KID=${CODEAPI_JWT_HS256_KID:-}
      - CODEAPI_JWT_HS256_SECRET=${CODEAPI_JWT_HS256_SECRET:-}
      - CODEAPI_JWT_SINGLE_TENANT_ID=${CODEAPI_JWT_SINGLE_TENANT_ID:-}
      - CODEAPI_TENANT_ISOLATION_STRICT=${CODEAPI_TENANT_ISOLATION_STRICT:-}
      - EXECUTION_MANIFEST_TTL_SECONDS=${EXECUTION_MANIFEST_TTL_SECONDS:-}
      - EXECUTION_MANIFEST_MAX_UPLOAD_BYTES=${EXECUTION_MANIFEST_MAX_UPLOAD_BYTES:-}
      - EXECUTION_MANIFEST_MAX_OUTPUT_FILES=${EXECUTION_MANIFEST_MAX_OUTPUT_FILES:-}
      - EXECUTION_MANIFEST_MAX_REQUESTS=${EXECUTION_MANIFEST_MAX_REQUESTS:-}
      - CODEAPI_HTTP_JSON_LIMIT=${CODEAPI_HTTP_JSON_LIMIT:-50mb}
      - FILE_SERVER_URL=http://file_server:3000
      - TOOL_CALL_SERVER_URL=http://tool_call_server:3033
      - CODEAPI_INTERNAL_SERVICE_TOKEN=${CODEAPI_INTERNAL_SERVICE_TOKEN:-localdev-internal-service-token}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-localdev}
      - PORT=3112
      # Note: No SANDBOX_ENDPOINT - API doesn't talk to sandbox directly
      # Note: No PYTHON_CONCURRENCY - API doesn't process jobs
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    depends_on:
      redis:
        condition: service_healthy
      file_server:
        condition: service_started
      tool_call_server:
        condition: service_started
    deploy:
      replicas: ${API_REPLICAS:-3}  # Scale based on HTTP traffic
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3112/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =============================================================================
  # WORKER-SANDBOX PODS (Worker + MicroVM Sandbox as a unit)
  # Scale based on: Queue depth, job wait time
  # Each pod runs its own microVM — PYTHON_CONCURRENCY is per-sandbox
  # =============================================================================
  worker-sandbox:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker-sandbox
      target: worker-sandbox-${KVM_ENABLED:-true}
    privileged: false
    devices:
      - ${KVM_DEVICE_PATH:-/dev/kvm}:/dev/kvm
    environment:
      - KVM_ENABLED=${KVM_ENABLED:-true}
      - LOCAL_MODE=${LOCAL_MODE:-true}
      # Worker config
      - SANDBOX_ENDPOINT=http://localhost:2000/api/v2
      - FILE_SERVER_URL=http://file_server:3000
      - TOOL_CALL_SERVER_URL=http://tool_call_server:3033
      - CODEAPI_INTERNAL_SERVICE_TOKEN=${CODEAPI_INTERNAL_SERVICE_TOKEN:-localdev-internal-service-token}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-localdev}
      - PYTHON_CONCURRENCY=1
      - OTHER_CONCURRENCY=8
      - JOB_WINDOW=1000
      - JOB_TIMEOUT=300000
      - WORKER_HEALTH_PORT=3113
      # Launcher config (microVM)
      - LAUNCHER_VCPUS=2
      - LAUNCHER_RAM_MIB=2048
      - LAUNCHER_LOG_LEVEL=3
      # Sandbox config (passed through to microVM guest)
      - SANDBOX_LOG_LEVEL=INFO
      - SANDBOX_PACKAGES_DIRECTORY=/pkgs
      - SANDBOX_MAX_PROCESS_COUNT=100
      - SANDBOX_MAX_CONCURRENT_JOBS=8
      - SANDBOX_PER_JOB_UIDS=true
      - SANDBOX_JOB_UID_BASE=200000
      - SANDBOX_JOB_GID_BASE=200000
      - SANDBOX_WORKSPACE_REAPER_MAX_AGE_SECONDS=3600
      - SANDBOX_RUN_CPU_TIME=60000
      - SANDBOX_RUN_TIMEOUT=300000
      - SANDBOX_OUTPUT_MAX_SIZE=65536
      - SANDBOX_DISABLE_NETWORKING=true
      - SANDBOX_ALLOWED_LOCAL_NETWORK_PORT=3033
      - SANDBOX_FORWARD_TARGET=tool_call_server:3033
      - LAUNCHER_PACKAGES_HOST=/disabled-host-packages
      # Recycle a worker-sandbox pod once its runner's open-fd count crosses
      # this threshold, before it can exhaust the container's fd limit and
      # cause `libc.so.6: cannot close file descriptor: Error 24` (EMFILE)
      # on subsequent job spawns. Set lower than the script's 40000 default
      # since replicas here run under sustained concurrent load.
      - SANDBOX_RUNNER_FD_LIVENESS_LIMIT=${SANDBOX_RUNNER_FD_LIVENESS_LIMIT:-20000}
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    volumes:
      - ${SANDBOX_PACKAGES_PATH:-./data/pkgs}:/host-packages:ro
    depends_on:
      redis:
        condition: service_healthy
      file_server:
        condition: service_started
      tool_call_server:
        condition: service_started
    deploy:
      replicas: ${WORKER_SANDBOX_REPLICAS:-6}  # Scale based on queue depth
    healthcheck:
      # Mirrors the base docker-compose.yaml sandbox-runner healthcheck — the
      # curl-based check this replaced only tested the worker HTTP port, not
      # the sandbox runner's own fd count, so this path never triggered
      # liveness-based recycling despite running the highest-concurrency
      # deployment target.
      test: ["CMD", "/usr/local/bin/sandbox-runner-healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 60

volumes:
  minio_data:

# =============================================================================
# USAGE NOTES
# =============================================================================
#
# Start with default replicas:
#   docker compose -f docker-compose.scalable.yml up
#
# Scale API pods (high HTTP traffic):
#   docker compose -f docker-compose.scalable.yml up --scale api=5
#
# Scale worker-sandbox pods (high execution demand):
#   docker compose -f docker-compose.scalable.yml up --scale worker-sandbox=10
#
# Scale both:
#   docker compose -f docker-compose.scalable.yml up --scale api=5 --scale worker-sandbox=10
#
# In Kubernetes:
# - Use HorizontalPodAutoscaler for api based on CPU/requests
# - Use HorizontalPodAutoscaler for worker-sandbox based on queue depth (custom metric)
# - Use K8s services for file_server and tool_call_server with multiple replicas
#
